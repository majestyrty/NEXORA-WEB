<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0e27" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Inner glow -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Payment card shape -->
  <rect x="40" y="60" width="120" height="80" rx="8" fill="none" stroke="#0066ff" stroke-width="2"/>
  
  <!-- Card chip -->
  <g>
    <rect x="50" y="70" width="20" height="20" rx="2" fill="#00d4ff" opacity="0.8"/>
    <line x1="55" y1="72" x2="65" y2="72" stroke="#0066ff" stroke-width="1" opacity="0.5"/>
    <line x1="55" y1="76" x2="65" y2="76" stroke="#0066ff" stroke-width="1" opacity="0.5"/>
    <line x1="55" y1="80" x2="65" y2="80" stroke="#0066ff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Dollar sign for payment -->
  <text x="100" y="112" font-size="40" font-weight="bold" fill="#00d4ff" text-anchor="middle" font-family="Arial">₦</text>
  
  <!-- Checkmark for security -->
  <g transform="translate(140, 80)">
    <circle cx="0" cy="0" r="12" fill="#00d4ff" opacity="0.2"/>
    <path d="M -5 0 L -1 4 L 5 -3" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
