<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Nexora Tech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .loader-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper img {
            max-width: 100%;
            max-height: 100%;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.6));
        }

        .spinner {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 3px solid transparent;
            border-top: 3px solid #0066ff;
            border-right: 3px solid #00d4ff;
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        .spinner::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            border: 3px solid transparent;
            border-bottom: 3px solid #ff6600;
            border-left: 3px solid #ffaa00;
            border-radius: 50%;
            animation: rotate-reverse 2s linear infinite;
        }

        .loading-text {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }

        .loading-text h2 {
            color: #00d4ff;
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .dot-animation {
            display: inline-block;
            color: #0066ff;
            font-size: 20px;
            margin-left: 5px;
        }

        .dot-animation span {
            animation: dot 1.4s infinite;
        }

        .dot-animation span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot-animation span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .status-text {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-reverse {
            0% {
                transform: rotate(360deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        @keyframes dot {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .loader-container {
                width: 250px;
                height: 250px;
            }

            .logo-wrapper {
                width: 150px;
                height: 150px;
            }

            .spinner {
                width: 170px;
                height: 170px;
            }

            .spinner::after {
                width: 170px;
                height: 170px;
            }

            .loading-text h2 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="logo-wrapper">
            <img src="logo.png" alt="Nexora Tech Logo">
        </div>
        <div class="loading-text">
            <h2>NEXORA TECH<span class="dot-animation"><span>.</span><span>.</span><span>.</span></span></h2>
            <p class="status-text">Loading Experience</p>
        </div>
    </div>

    <script>
        // Redirect to home page after 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        });

        // Fallback: redirect after 5 seconds even if load event doesn't fire
        setTimeout(() => {
            if (window.location.href.includes('loader.html')) {
                window.location.href = 'index.html';
            }
        }, 5000);
    </script>
</body>
</html>
